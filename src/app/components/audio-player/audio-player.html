<div class="player">
  <div class="timebar">
    <span>{{ player.estimatedCurrentTime() | time }}</span>
    <input type="range" name="track" min="0" max="1" step="0.0001" [ngModel]="player.playerProgress()"
      (ngModelChange)="player.setPlayerProgress($event)">
    <span>{{ player.estimatedDuration() | time }}</span>
  </div>
  <div class="controls">
    <button (click)="player.playPause()">
      @if (player.isPlaying()) {
        <i class="fa-solid fa-pause"></i>
      } @else {
        <i class="fa-solid fa-play"></i>
      }
    </button>
    <button [disabled]="!player.isPlaying()" (click)="player.stop()">
      <i class="fa-solid fa-stop"></i>
    </button>
  </div>
</div>
